name: Update profile

on:
  schedule:
    # 每天 UTC 08:00 (太平洋时间凌晨 0/1 点)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # github-profile-3d-contrib 的 YEAR 需显式指定 (upstream issue #163)，
      # 这里动态取当前年份，避免硬编码导致次年失效。
      - name: Resolve current year
        id: year
        run: echo "value=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Generate 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: ${{ steps.year.outputs.value }}
          SETTING_JSON: ./3d-profile-settings.json

      - name: Move generated SVG to repo root
        run: |
          mv ./profile-3d-contrib/profile-3d.svg ./profile-3d.svg
          rm -rf ./profile-3d-contrib

      - name: Commit & push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A .
          git diff --staged --quiet || git commit -m "chore: update 3D contribution profile"
          git push
